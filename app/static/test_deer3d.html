<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3D Deer Test</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d1035; overflow: hidden; }
  #deer3d { position: absolute; left: 50%; bottom: 20px; width: 260px; height: 260px; transform: translateX(-50%); }
  #btns { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; z-index: 10; }
  #btns button { padding: 10px 20px; border: none; border-radius: 99px; background: rgba(255,255,255,.15); color: #fff; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<div id="btns">
  <button onclick="doSpin()">3D 转圈</button>
  <button onclick="doLeap()">一跃而起</button>
  <button onclick="doIdle()">待机呼吸</button>
</div>
<div id="deer3d"></div>
<script src="/static/assets/js/three.min.js"></script>
<script>
/* ===== 3D 小鹿建模（程序化，Ori2 风格发光材质） ===== */
var deerScene, deerCamera, deerRenderer, deerGroup;
var deerAnim = null; // 当前动作

function initDeer() {
  var box = document.getElementById('deer3d');
  deerScene = new THREE.Scene();
  deerCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
  deerCamera.position.set(0, 1.2, 5.6);
  deerCamera.lookAt(0, 0.8, 0);

  deerRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  deerRenderer.setSize(box.clientWidth, box.clientHeight);
  deerRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  box.appendChild(deerRenderer.domElement);

  // 灯光：暖色主光 + 冷色补光（Ori2 氛围）
  var hemi = new THREE.HemisphereLight(0xffe9c8, 0x8a9cff, 0.9);
  deerScene.add(hemi);
  var key = new THREE.DirectionalLight(0xffd9a0, 1.0);
  key.position.set(3, 5, 4);
  deerScene.add(key);
  var fill = new THREE.PointLight(0x9ab0ff, 0.6, 12);
  fill.position.set(-3, 2, -2);
  deerScene.add(fill);

  // ===== 建模 =====
  deerGroup = new THREE.Group();

  function mat(color, emissive, emInt) {
    return new THREE.MeshStandardMaterial({
      color: color, roughness: .55, metalness: .1,
      emissive: emissive || 0x000000, emissiveIntensity: emInt || 0
    });
  }
  var bodyMat = mat(0xd9c9a8, 0x6b4a2a, .12);
  var darkMat = mat(0x8a6f4e, 0x3a2a18, .15);
  var antlerMat = mat(0xd9b98a, 0x8a6a35, .35);

  // 身体（压扁椭球）
  var body = new THREE.Mesh(new THREE.SphereGeometry(0.62, 24, 18), bodyMat);
  body.scale.set(1.32, 0.9, 0.82);
  body.position.y = 0.95;
  deerGroup.add(body);

  // 后腿（2）
  function leg(x, z) {
    var l = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.1, 0.6, 10), darkMat);
    l.position.set(x, 0.3, z);
    return l;
  }
  deerGroup.add(leg(-0.32, 0.24)); deerGroup.add(leg(0.32, 0.24));
  deerGroup.add(leg(-0.3, -0.26)); deerGroup.add(leg(0.3, -0.26));

  // 脖子（斜向前）
  var neck = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.17, 0.52, 12), bodyMat);
  neck.position.set(0.55, 1.16, 0);
  neck.rotation.z = -0.6;
  deerGroup.add(neck);

  // 头
  var head = new THREE.Mesh(new THREE.SphereGeometry(0.2, 18, 14), bodyMat);
  head.position.set(0.9, 1.52, 0);
  head.scale.set(0.9, 0.82, 0.78);
  deerGroup.add(head);

  // 口鼻
  var snout = new THREE.Mesh(new THREE.SphereGeometry(0.09, 12, 10), darkMat);
  snout.position.set(1.1, 1.46, 0);
  snout.scale.set(1, 0.8, 0.8);
  deerGroup.add(snout);

  // 耳朵（2）
  function ear(x) {
    var e = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 10), bodyMat);
    e.position.set(x, 1.74, 0);
    e.rotation.z = x > 0 ? 0.25 : -0.25;
    return e;
  }
  deerGroup.add(ear(0.86)); deerGroup.add(ear(1.1));

  // 鹿角（左右各一，双叉）
  function antler(x) {
    var g = new THREE.Group();
    var main = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.04, 0.34, 8), antlerMat);
    main.position.y = 0.17;
    var br = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.03, 0.18, 8), antlerMat);
    br.position.set(0.07, 0.33, 0);
    br.rotation.z = -0.5;
    g.add(main); g.add(br);
    g.position.set(x, 1.6, 0);
    return g;
  }
  deerGroup.add(antler(-0.06)); deerGroup.add(antler(0.06));

  // 尾巴
  var tail = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 8), bodyMat);
  tail.position.set(-0.72, 1.15, 0);
  deerGroup.add(tail);

  // 发光粒子（萤火虫光点，Ori2 氛围）
  var glowPts = [];
  for (var i = 0; i < 26; i++) {
    var p = new THREE.Mesh(new THREE.SphereGeometry(0.02 + Math.random()*0.03, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0xffe9a8, transparent: true, opacity: .85 }));
    var a = Math.random() * Math.PI * 2;
    var r = 0.9 + Math.random() * 1.6;
    p.position.set(Math.cos(a)*r, 0.4 + Math.random()*1.8, Math.sin(a)*r);
    glowPts.push(p);
    deerScene.add(p);
  }

  deerScene.add(deerGroup);
  deerGroup.position.y = 0;
  deerGroup.scale.set(1, 1, 1);

  // ===== 动画循环 =====
  var clock = new THREE.Clock();
  var spinProg = -1, leapProg = -1, t = 0;
  function animate() {
    requestAnimationFrame(animate);
    var dt = clock.getDelta();
    t += dt;

    // 萤火虫浮动
    for (var i = 0; i < glowPts.length; i++) {
      glowPts[i].position.y += Math.sin(t*2 + i*1.7) * 0.0015;
    }

    if (deerAnim === 'spin') {
      deerGroup.rotation.y += dt * 3.4; // 绕 Y 轴立体转一圈
      deerGroup.position.y = 0.15 + Math.sin(deerGroup.rotation.y) * 0.12; // 微微起伏
      if (deerGroup.rotation.y >= Math.PI*2) { deerGroup.rotation.y = 0; deerAnim = null; }
    } else if (deerAnim === 'leap') {
      // 一跃而起：抛物线
      if (leapProg < 0) leapProg = 0;
      leapProg += dt * 1.6;
      var p = leapProg;
      if (p >= 1) { leapProg = -1; deerGroup.position.y = 0; deerGroup.rotation.x = 0; deerAnim = null; }
      else {
        deerGroup.position.y = Math.sin(p * Math.PI) * 1.2; // 跳高 1.2
        deerGroup.rotation.x = Math.sin(p * Math.PI) * -0.25; // 前倾
      }
    } else {
      // 待机呼吸
      deerGroup.position.y = Math.sin(t * 2.4) * 0.035;
      deerGroup.scale.y = 1 + Math.sin(t * 2.4) * 0.012;
    }

    deerRenderer.render(deerScene, deerCamera);
  }
  animate();
}

function doSpin() { deerAnim = 'spin'; deerGroup.rotation.y = 0; }
function doLeap() { deerAnim = 'leap'; leapProg = 0; }
function doIdle() { deerAnim = null; leapProg = -1; }

window.addEventListener('resize', function(){
  var box = document.getElementById('deer3d');
  if (deerRenderer) deerRenderer.setSize(box.clientWidth, box.clientHeight);
});
initDeer();
</script>
</body>
</html>
