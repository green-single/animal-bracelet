name: Keep Render Awake

on:
  schedule:
    # 北京时间 7:00-23:00 = UTC 23:00 + 0-15 点，每14分钟ping一次
    - cron: '*/14 23 * * *'
    - cron: '*/14 0-15 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping site to prevent Render sleep
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://animal-bracelet.onrender.com/ || echo "000")
          echo "HTTP status: $code"
